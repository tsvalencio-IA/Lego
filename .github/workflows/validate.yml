name: Validar OTTO LEGO Simples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar a sintaxe
        run: |
          node --check simple.js
          node --check viewer3d.js
          node --check generator.js
          node --check inventory-seed.js
      - name: Testar o aplicativo real
        run: |
          node tests/v4.cjs
          node tests/viewer3d.cjs
