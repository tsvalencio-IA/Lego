name: Validar OTTO LEGO Projetos Reais
on:
  push:
    branches: [main, reconstrucao-fiel-10698]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript do catálogo e visualizador antigo
        run: |
          node --check catalogo-reais.js
          node --check catalogo-app.js
          node --check viewer3d.js
          node --check modelos3d-engine.js
          node --check modelos3d-canvas.js
          node --check modelos3d-ui.js
          node --check modelos3d-catalogo.js
          node --check fidelidade.js
      - name: Verificar fontes verdadeiras e retirar geração livre
        run: |
          node tests/catalogo-v6.cjs
          node tests/viewer3d.cjs
          node tests/modelos3d.cjs
          node tests/fidelidade.cjs
          node tests/manual-trace.cjs
          node tests/materiais-originais.cjs
          node tests/encaixes-iniciais.cjs
          node tests/camera-manual-trace.cjs
          node tests/parciais.cjs
          node tests/controle-release.cjs
          node scripts/verificar-fidelidade.cjs
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Testar catálogo real e cidade no celular e computador
        run: node tests/browser.cjs
